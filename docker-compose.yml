services:
  database:
    container_name: postgres
    image: postgres:17.5-alpine3.22
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  cache:
    container_name: cache
    image: redis:8.0.3-alpine3.21
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data